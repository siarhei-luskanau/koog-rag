version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      kotlin-ecosystem:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      ktor:
        patterns:
          - "io.ktor*"
      koog:
        patterns:
          - "ai.koog*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
